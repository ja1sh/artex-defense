[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "artex-defense"
version = "0.1.0"
description = "Experimental Sigma defense pack and offline purple-team fixtures"
requires-python = ">=3.10"
dependencies = ["PyYAML==6.0.3"]
[project.optional-dependencies]
test = ["pytest==8.4.2", "pySigma==0.11.23","pySigma-backend-splunk==1.1.3"]
[project.scripts]
artex-replay = "artex_defense.engine:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
