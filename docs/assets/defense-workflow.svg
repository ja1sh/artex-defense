<text x="70" y="251" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#e6edf7">NORMALIZE</text>
<text x="70" y="284" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#b7c8df">Web / auth / cloud audit</text>
<text x="70" y="311" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#b7c8df">Stable actor + tenant IDs</text>
<text x="70" y="338" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#b7c8df">Trusted session linkage</text>
<rect x="428" y="183" width="344" height="183" rx="16" fill="#142238" stroke="#28425f"/>
<text x="450" y="218" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#68dcca">02</text>
<text x="450" y="251" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#e6edf7">DETECT + CORRELATE</text>
<text x="450" y="284" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#b7c8df">7 original context rules</text>
<text x="450" y="311" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#b7c8df">2 Xint / Theori fingerprints</text>
<text x="450" y="338" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#b7c8df">5 behavioral correlations</text>
<rect x="808" y="183" width="344" height="183" rx="16" fill="#142238" stroke="#28425f"/>
<text x="830" y="218" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#68dcca">03</text>
<text x="830" y="251" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#e6edf7">REPLAY + REVIEW</text>
<text x="830" y="284" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#b7c8df">Positive: 5 scenario alerts</text>
<text x="830" y="311" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#b7c8df">Benign: 0 correlations</text>
<text x="830" y="338" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#b7c8df">Approved CI: 1 known FP</text>
