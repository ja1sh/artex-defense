<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">ARTEX Defense Lab: from telemetry to testable hypotheses</title>
<desc id="desc">Seven original behavior rules and two upstream fingerprints support five correlation scenarios. Offline positive, benign, and known false positive fixtures validate logic. Production mapping and attribution remain unvalidated.</desc>
<rect width="1200" height="800" rx="24" fill="#0b1220"/>
<text x="48" y="54" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#68dcca">ARTEX DEFENSE LAB</text>
<text x="48" y="106" font-family="DejaVu Sans, Arial, sans-serif" font-size="36" font-weight="700" fill="#e6edf7">Turn telemetry into testable hypotheses.</text>
<text x="48" y="143" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#b7c8df">A Sigma + purple-team starter. Behavior evidence, not attacker attribution.</text>
<rect x="48" y="183" width="344" height="183" rx="16" fill="#142238" stroke="#28425f"/>
