title: Distinct Vault Secrets Read By Actor
id: 4c0ba112-e736-5d15-b8a8-6b0921578014
name: ad_bulk_secrets
status: experimental
description: Ten distinct secret resources in ten minutes. Tune for legitimate startup,
  backup, and rotation workflows.
author: Jai Sharma
date: '2026-11-15'
correlation:
  type: value_count
  rules:
  - ad_secret_read
  group-by:
  - TenantId
  - ActorId
  - VaultId
  timespan: 10m
  condition:
    field: ResourceId
    gte: 10
level: medium
